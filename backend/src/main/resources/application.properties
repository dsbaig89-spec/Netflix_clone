
spring.application.name=streamai-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:netflix_ai}
spring.datasource.username=${DB_USERNAME:streamflix_backend}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

tmdb.api-key=${TMDB_API_KEY:}
tmdb.access-token=${TMDB_ACCESS_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3